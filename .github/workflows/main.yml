name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Find project folder
        run: |
          P=$(find . -name pubspec.yaml -not -path './.git/*' | head -1)
          if [ -z "$P" ]; then
            echo "ERROR: pubspec.yaml was not uploaded."
            exit 1
          fi
          D=$(dirname "$P")
          echo "Project folder: $D"
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build debug APK
        run: |
          B="$GITHUB_WORKSPACE/build_app"
          flutter create --org com.skillify --project-name skillify --platforms=android "$B"
          cp "$PROJECT_DIR/pubspec.yaml" "$B/pubspec.yaml"
          rm -rf "$B/lib" "$B/test"
          cp -r "$PROJECT_DIR/lib" "$B/lib"
          cp -r "$PROJECT_DIR/assets" "$B/assets"
          M="$B/android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="[^"]*"/android:label="Skillify"/' "$M"
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/><application#' "$M"
          sed -i 's#</queries>#<intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries>#' "$M"
          cd "$B"
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Skillify-debug-apk
          path: build_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
