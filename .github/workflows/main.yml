name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project and build debug APK
        run: |
          flutter --version
          flutter create --org com.skillify --project-name skillify --platforms=android build_app
          cp pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib build_app/test
          cp -r lib build_app/lib
          cp -r assets build_app/assets
          python3 tools/patch_manifest.py build_app/android/app/src/main/AndroidManifest.xml
          cd build_app
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Skillify-debug-apk
          path: build_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
